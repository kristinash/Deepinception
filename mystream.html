function nameToColor(name) {
if (name === 'Админ') return '#f5c842';
    const colors = [
        '#e05c5c', '#e07a5c', '#e0b55c', '#8dbd4e',
        '#4eb87a', '#4eb8b8', '#4e82e0', '#8a4ee0',
        '#c44ee0', '#e04ea8', '#5ca8e0', '#a0c44e'
    ];
    let hash = 0;
    for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + hash * 31;
    }
    return colors[Math.abs(hash) % colors.length];
}

function getQualityParams(viewerCount) {
    // if (viewerCount <= 2)  return { maxBitrate: 3_000_000, maxFramerate: 24, scaleDown: 1.0   };
    if (viewerCount <= 4)  return { maxBitrate: 3_000_000, maxFramerate: 24, scaleDown: 1.0   };
    if (viewerCount <= 8)  return { maxBitrate: 2_500_000, maxFramerate: 20, scaleDown: 1.5   };
    return { maxBitrate: 2_000_000, maxFramerate: 18, scaleDown: 2.25   }; 
}

}

const _prevStats = {};


async function collectStats() {
    const rows = [];
    const now = Date.now();
    for (const [peerId, pc] of Object.entries(peerConnection)) {
        if (!pc || pc.connectionState === 'closed') continue;
        const report = await pc.getStats();
        const viewer = viewersList.find(v => v.id === peerId);
        const row = {
            id: peerId,
            name: viewer ? viewer.name : '—',   
            fps: null,
            cpuLimit: null,
            bitrateKbps: null,
        };
        report.forEach(stat => {
            if (stat.type === 'outbound-rtp' && stat.kind === 'video') {
                row.fps = stat.framesPerSecond != null ? Math.round(stat.framesPerSecond) : null;
                row.cpuLimit = stat.qualityLimitationReason ?? null;
                const prev = _prevStats[peerId];
                if (prev && stat.bytesSent != null) {
                    const dtSec = (now - prev.ts) / 1000;
                    const dBytes = stat.bytesSent - (prev.bytesSent ?? 0);
                    row.bitrateKbps = dtSec > 0 ? Math.round((dBytes * 8) / dtSec / 1000) : null;
                }
                _prevStats[peerId] = { ts: now, bytesSent: stat.bytesSent };
            }
        });
        rows.push(row);
    }
    return rows;
}

const COLS = [
      { key: 'name', label: 'Name' },   
    { key: 'fps', label: 'FPS' },
    { key: 'cpuLimit', label: 'CPU / BW limit' },
    { key: 'bitrateKbps', label: 'bitrateKbps' },
     { key: 'action', label: 'Delete' }
];

async function renderStatsTable() {
    const rows = await collectStats();
    const head = document.getElementById('statsHead');
    const body = document.getElementById('statsBody');
    const status = document.getElementById('statsStatus');
    if (!head.children.length) {
        head.innerHTML = COLS.map(c => `<th class="stats-table-th">${c.label}</th>`).join('');
    }
    if (!rows.length) {
         body.innerHTML = ''; 
        return;
    }
    body.innerHTML = rows.map(row => {
            const cells = COLS.map(col => {
                if (col.key === 'action') {
                    return `<td class="stats-cell"><button class="kick-btn" data-id="${row.id}">Удалить</button></td>`;
                }
                let val = row[col.key];
                if (col.key === 'cpuLimit' && !val) val = 'none';
                return `<td class="stats-cell">${(val != null && val !== '') ? val : '—'}</td>`;
            }).join('');
            return `<tr class="stats-row">${cells}</tr>`;
        }).join(''); 

}

async function applyQualityToAll(viewerCount) {

        const { maxBitrate, maxFramerate, scaleDown  } = getQualityParams(viewerCount);
        for (const id of Object.keys(peerConnection)) {
            const pc = peerConnection[id];
            if (!pc || pc.connectionState === 'closed' || pc.signalingState === 'closed') continue;
            for (const sender of pc.getSenders()) {
                if (sender.track?.kind !== 'video') continue;
                const params = sender.getParameters();
                if (!params.encodings?.length) continue;
                params.encodings[0].maxBitrate  = maxBitrate;
                params.encodings[0].maxFramerate = maxFramerate;
                params.encodings[0].scaleResolutionDownBy = scaleDown;
                try { await sender.setParameters(params); } catch (err) {
                    console.warn(`[applyQuality] ${id}:`, err.message);
                }
            }
        }

}






    channel.onmessage = async (e) => {
        const id = e.data.id;

        if (e.data.type === "icecandidate") {
            if (peerConnection[id]?.remoteDescription) {
                peerConnection[id].addIceCandidate(e.data.candidate);
            } else {
                if (!pendingCandidates[id]) pendingCandidates[id] = [];
                pendingCandidates[id].push(e.data.candidate);
            }

        } else if (e.data.type === "answer") {
            console.log("received answer from", id);
            await peerConnection[id]?.setRemoteDescription(e.data);

            if (pendingCandidates[id]) {
                pendingCandidates[id].forEach(cand => peerConnection[id].addIceCandidate(cand));
                delete pendingCandidates[id];
            }
           
             

        } else if (e.data.type === "joined-channel") {
            channel.postMessage({ type: "videostate", state, id, roomId });
            const viewerCount = e.data.viewers;
            viewers.textContent = viewerCount;
           
        if (!viewersList.find(v => v.id === e.data.id)) {
        viewersList.push({ id: e.data.id, name: e.data.name });
    }
           
           
        if (statsInterval) renderStatsTable(); 
            if (currentFile) {
                if (probingQueue.some(item => item.id === id)) return;
                if (currentProbeId === id) {
                            if (peerConnection[id]) {
                                peerConnection[id].close();
                                delete peerConnection[id];
                            }
                            if (probeResolve) probeResolve();
                            setTimeout(() => admitWithProbe(id, viewerCount), 0);
                            return;
                        }
                await admitWithProbe(id, viewerCount);

            }

        } else if (e.data.type === "receive-message") {
            addMessage(e.data.name, e.data.message);
            showAdminToast(e.data.name, e.data.message);
            if (!isChatOpen) chatToggleBtn.classList.add('new-message');

        } else if (e.data.type === "error-admin-exists") {
            window.location.replace('startpage.html');

        } 
         else if (e.data.type === "error-wrong-secret") {
    window.location.replace('startpage.html');
}
        else if (e.data.type === "count") {
           viewers.textContent = e.data.viewers
        } 
        else if (e.data.type === "admin_again_here") {
             const viewerCount = e.data.viewerscount;
            viewers.textContent = viewerCount;
            viewersList = Object.entries(e.data.allnames || {}).map(([id, name]) => ({ id, name }));
            //viewers.textContent = Object.keys(peerConnection).length;

        } else if (e.data.type === "chat-history") {
            e.data.messages.forEach(msg => addMessage(msg.name, msg.text));

        } else if (e.data.type === "leave-channel") {
              viewersList = viewersList.filter(v => v.id !== e.data.id);
   
            const viewerCount = e.data.viewers;
            viewers.textContent = viewerCount;
             removeFromProbingQueue(id);
            if (peerConnection[id]) {
                peerConnection[id].close();
                delete peerConnection[id];
            }
             if (currentProbeId === id && probeResolve) {
                probeResolve();  
            }
             if (statsInterval) renderStatsTable();
           
            await applyQualityToAll(Object.keys(peerConnection).length);
        }
    };

let isProbing = false;
let probeResolve = null;
let probingQueue = [];
let currentProbeId = null;  
let isProcessingQueue  = false

function removeFromProbingQueue(id) {
    const before = probingQueue.length;
    probingQueue = probingQueue.filter(item => item.id !== id);
    
}


const MIN_FPS_MAJORITY = 15;   
const MIN_FPS_ANY = 10;

async function snapshotFps(ids) {
    const result = {};
    for (const id of ids) {
        const pc = peerConnection[id];
        if (!pc || pc.connectionState === 'closed') {
            result[id] = null;
            continue;
        }
        const stats = await pc.getStats();
        let fps = null;
        for (const stat of stats.values()) {
            if (stat.type === 'outbound-rtp' && stat.kind === 'video') {
                fps = stat.framesPerSecond !== undefined ? Math.round(stat.framesPerSecond) : null;
                break;
            }
        }
        result[id] = fps;
    }
    console.log('[snapshotFps]', JSON.stringify(result, null, 2));
    return result;
}
     const TEST_DURATION_MS = 5000;
       const INTERVAL_MS = 1000;
       let probeStartTime = 0;
async function admitWithProbe(id, viewerCount) {
   
    
    if (isProbing ) {
        probingQueue.push({ id, viewerCount });
        const position = probingQueue.length; 
        
        const elapsed = Date.now() - probeStartTime;
        const remaining = Math.max(0, TEST_DURATION_MS - elapsed);
        
        const waitMs = remaining + position * TEST_DURATION_MS;
        
        channel.postMessage({ type: 'checking', id, roomId, seconds: Math.ceil(waitMs / 1000) });

       
        return;
    }
    

    isProbing = true;
    currentProbeId = id; 
    probeStartTime = Date.now(); 
    channel.postMessage({ type: 'checking', id, roomId, seconds: TEST_DURATION_MS / 1000 });
    try {
        const existingIds = Object.keys(peerConnection);
        // if (await hasCpuQualityLimit(existingIds)) {
        //     console.log(`[probe] ${id.slice(0,6)} отклонён: у существующих зрителей проблемы CPU`);
        //     channel.postMessage({ type: 'room-full', id, roomId, message: "технические характеристки" });
        //     return;
        // }
        
      

        await startStreaming(id, viewerCount);
        const fpsHistory = {};
   
      
        let badNews = 0;
        let counts = 0;

        await new Promise(resolve => {
             probeResolve = resolve;
            const timer = setInterval(async () => {

                if (!peerConnection[id]) {
                clearInterval(timer);
                resolve();
                return;
            }

                counts++;
                const allIds = Object.keys(peerConnection);
                const snap = await snapshotFps(allIds);

                 for (const pid of allIds) {
                    if (!fpsHistory[pid]) fpsHistory[pid] = [];
                    fpsHistory[pid].push(snap[pid]);
                }

                let lowFpsCount = 0;
                for (const pid of allIds) {
                    if ( snap[pid] !== null && snap[pid] <= MIN_FPS_MAJORITY) lowFpsCount++;
                }
                const majorityBad = allIds.length > 0 && lowFpsCount / allIds.length > 0.5;
                const anyCritical = Object.values(snap).some(fps => fps !== null && fps <= MIN_FPS_ANY);
                // const hasCpuLimit = await hasCpuQualityLimit(allIds);

                // const bad = majorityBad || anyCritical || hasCpuLimit;
                 const bad = majorityBad || anyCritical;
                if (bad) badNews++;

                if (counts * INTERVAL_MS >= TEST_DURATION_MS) {
                    clearInterval(timer);
                    resolve();
                }
            }, INTERVAL_MS);
        });
          probeResolve = null; 
          if (probeCancelled) {
            console.log(`[probe] ${id.slice(0,6)} — проба отменена (смена файла)`);
            return;  
        }
        if (!peerConnection[id]) {
            console.log(`[probe] ${id.slice(0,6)} отключился во время проверки`);
            return; 
        }
        const violationRatio = badNews / counts;
       const newViewerHistory = fpsHistory[id] || [];
        const neverGotFps = newViewerHistory.every(fps => fps === null);
        if (violationRatio > 0.5 || neverGotFps) {
            if (peerConnection[id]) {
                peerConnection[id].close();
                delete peerConnection[id];  
            }
            if (neverGotFps) {
                 channel.postMessage({ type: 'room-full', id, roomId, message: "VPN" });
            }
            else { channel.postMessage({ type: 'room-full', id, roomId, message: "технические характеристки" });}
           
            const msg = `⛔ ${id.slice(0,6)} отключён (FPS низкий или CPU limit)`;
            console.log(`[probe] ${msg}`);
        } else {
            channel.postMessage({ type: 'probe-passed', id, roomId }); 
            // viewers.textContent = Object.keys(peerConnection).length;  
            console.log(`[probe] ✅ ${id.slice(0,6)} принят`);
             }
    } catch (err) {
        if (peerConnection[id]) {
            peerConnection[id].close();
            delete peerConnection[id];
        }
        channel.postMessage({ type: 'room-full', id, roomId, message: "технические характеристки" });
    } finally {
        probeCancelled = false; 
         currentProbeId = null;  
        probeResolve = null;    
        isProbing = false;
        if (probingQueue.length) {
            const next = probingQueue.shift();
            admitWithProbe(next.id, next.viewerCount);
        }
    }
}



    async function startStreaming(id, viewerCount = null) {
        const config = {
            iceServers: [
               { urls: "stun:YOUR_SERVER_IP:3478" },
{ urls: "turn:YOUR_SERVER_IP:3478", username: "YOUR_USER", credential: "YOUR_PASSWORD" }
            ],
            iceTransportPolicy: "all",
            bundlePolicy:       "max-bundle",
            rtcpMuxPolicy:      "require",
            sdpSemantics:       "unified-plan"
        };

        const pc = new RTCPeerConnection(config);
        peerConnection[id] = pc;

        pc.addEventListener('connectionstatechange', async () => {
    if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
        pc.close();
        delete peerConnection[id];
         removeFromProbingQueue(id);
      await applyQualityToAll(Object.keys(peerConnection).length);
       
           channel.postMessage({ type: "force-leave", id, roomId});
    }
});

        pc.addEventListener("icecandidate", e => {
            if (e.candidate) {
                channel.postMessage({
                    type:      "icecandidate",
                    candidate: e.candidate.toJSON(),
                    id
                });
            }
        });

         sharedstream?.getTracks().forEach(track => {
        const sender = pc.addTrack(track, sharedstream);

   
        if (sender.track?.kind === 'video') {
            const params = sender.getParameters();
            if (!params.encodings?.length) params.encodings = [{}];
            const { maxBitrate, maxFramerate, scaleDown } = getQualityParams(viewerCount ?? 1);
            params.encodings[0].maxBitrate = maxBitrate;
            params.encodings[0].maxFramerate = maxFramerate;
            params.encodings[0].scaleResolutionDownBy = scaleDown;
            sender.setParameters(params).catch(() => {});
        }
    });
       await applyQualityToAll(Object.keys(peerConnection).length);

   
        const offer = await pc.createOffer();
       
 
         const sdp = offer.sdp
        await pc.setLocalDescription({ type: offer.type, sdp });
        console.log(`[${id}] Offer создан, H264 форсирован, отправляем...`);
        
       
        channel.postMessage({ type: 'offer', sdp, id });
    }


    const playPauseBtn = document.getElementById('playPauseBtn');
    const adminMuteBtn = document.getElementById('adminMuteBtn');
    const adminFsBtn   = document.getElementById('adminFsBtn');
    const ctrlTime     = document.getElementById('ctrlTime');
    const progressFill = document.getElementById('progressFill');
    const progressThumb= document.getElementById('progressThumb');
    const progressBar  = document.getElementById('progressBar');

    function formatTime(sec) {
    const hours = Math.floor(sec / 3600);
    const minutes = Math.floor((sec % 3600) / 60);
    const seconds = Math.floor(sec % 60);

    if (hours > 0) {
        return `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    } else {
        return `${minutes}:${seconds.toString().padStart(2, '0')}`;
    }
}

    player.addEventListener('timeupdate', () => {
        if (!player.duration) return;
        const pct = (player.currentTime / player.duration) * 100;
        progressFill.style.width  = pct + '%';
        progressThumb.style.left  = pct + '%';
        ctrlTime.textContent = `${formatTime(player.currentTime)} / ${formatTime(player.duration)}`;
    });

    progressBar.addEventListener('click', (e) => {
        if (!player.duration) return;
        const rect = progressBar.getBoundingClientRect();
        const pct  = (e.clientX - rect.left) / rect.width;
        player.currentTime = pct * player.duration;
    });

    let isDragging = false;
    progressBar.addEventListener('mousedown', () => { isDragging = true; });
    document.addEventListener('mousemove', (e) => {
        if (!isDragging || !player.duration) return;
        const rect = progressBar.getBoundingClientRect();
        const pct  = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        player.currentTime = pct * player.duration;
    });
    document.addEventListener('mouseup', () => { isDragging = false; });


     playPauseBtn.addEventListener('click', () => {
        player.paused ? player.play() : player.pause();
    });

    player.addEventListener('pause', () => { playPauseBtn.textContent = '▶'; });
    player.addEventListener('play',  () => { playPauseBtn.textContent = '⏸'; });

    adminMuteBtn.addEventListener('click', () => {
        player.muted = !player.muted;
        adminMuteBtn.textContent = player.muted ? '🔇' : '🔊';
    });

    document.addEventListener("click", (e)=>{
        if (e.target === document.getElementById('player')) {
            player.paused ? player.play() : player.pause();
        }
    })

 adminFsBtn.addEventListener('click', () => {

        if (screen.orientation?.unlock) {
            try { screen.orientation.unlock(); } catch(_) {}
        }

                screen.orientation?.lock?.('landscape')
                    .catch(err => console.warn('lock failed', err));
            }
        }).catch(err => console.warn('Fullscreen error:', err));
    }
});

        document.getElementById('adminToastName').textContent = name;

        toast.classList.remove('show');
        void toast.offsetWidth;
        toast.classList.add('show');
        clearTimeout(adminToastTimer);
        adminToastTimer = setTimeout(() => toast.classList.remove('show'), 4000);
    }
